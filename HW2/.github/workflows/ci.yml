name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Lint, Test & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Linter (Ruff)
        run: |
          ruff check .

      - name: Run Pytest with Line Coverage (≥80% target)
        env:
          GITHUB_TOKEN: "mock_token"
          GITHUB_OWNER: "mock_owner"
          GITHUB_REPO: "mock_repo"
          WEBHOOK_SECRET: "mock_secret"
          PORT: 8000
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 tests/

      - name: Verify OpenAPI 3.1 Contract Generation
        env:
          GITHUB_TOKEN: "mock_token"
          GITHUB_OWNER: "mock_owner"
          GITHUB_REPO: "mock_repo"
          WEBHOOK_SECRET: "mock_secret"
          PORT: 8000
        run: |
          python scripts/export_openapi.py
          test -f openapi.yaml

  docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t hw2-issues-service:${{ github.sha }} .
